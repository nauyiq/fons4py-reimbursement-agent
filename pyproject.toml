[project]
name = "fons4py-reimbursement-agent"
version = "0.1.0"
description = "Python 报销领域 Agent：LangChain/LangGraph 工作流 + FastAPI 业务服务 + A2A 接入 Java 主编排"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncmy>=0.2.16",
    "fastapi>=0.143.0",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reimbursement"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
